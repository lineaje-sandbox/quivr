workflow_config:
  name: "standard RAG"
  nodes:
    - name: "START"
      edges: ["filter_history"]

    - name: "filter_history"
      edges: ["rewrite"]

    - name: "rewrite"
      edges: ["retrieve"]

    - name: "retrieve"
      edges: ["generate_rag"]

    - name: "generate_rag" # the name of the last node, from which we want to stream the answer to the user
      edges: ["END"]
      # cited_answer needs integer citation IDs from function calling.
      # Local Ollama models often emit "[1]" as ["[", 1, "]"] and crash metadata parsing.

# Maximum number of previous conversation iterations
# to include in the context of the answer
max_history: 10

# Reranker configuration
# reranker_config:
#   # The reranker supplier to use
#   supplier: "cohere"

#   # The model to use for the reranker for the given supplier
#   model: "rerank-multilingual-v3.0"

#   # Number of chunks returned by the reranker
#   top_n: 5

# Configuration for the LLM (Ollama OpenAI-compatible API).
# max_output_tokens must be >= 4096 or RetrievalConfig validation fails.
llm_config:
  model: llama3
  llm_base_url: http://localhost:11434/v1
  llm_api_key: ollama
  max_output_tokens: 8192
  temperature: 0.7
